# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]  # 监听 master 分支
  workflow_dispatch:     # 支持手动触发

# 设置部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 保证只有一个部署任务在运行，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 安装 pnpm（自动读取 package.json 中的 "packageManager" 字段）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest  # 或者指定具体版本，如 '9'

      # 2. 安装 Node.js 并设置 pnpm 缓存
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'   # 关键：自动缓存 pnpm 的全局存储，极大提速

      # 3. 安装依赖（--frozen-lockfile 相当于 npm ci，确保锁定版本）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_SCRIPT_EXECUTION: allow

      # 4. 构建项目
      - name: Build project
        run: pnpm run build  # 这行会执行 package.json 中的 build 脚本

      # 5. 上传构建产物（供 deploy 作业使用）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.vuepress/dist     # ⚠️ 关键：务必改成你项目实际的输出目录（如 public、build）

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4